[workspace]
members = ["crates/lh-protocol", "crates/lh-plugin-sdk", "crates/lh-core", "crates/lh-cli", "plugins/mock-backend", "plugins/backend-llamacpp", "plugins/backend-freetoken"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }
clap = { version = "4", features = ["derive"] }
lh-protocol = { path = "crates/lh-protocol" }
lh-plugin-sdk = { path = "crates/lh-plugin-sdk" }
lh-core = { path = "crates/lh-core" }

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
